# Wayle configuration file

imports = ["/home/sharkthak/.config/wayle/layout.toml"]

[general]
font-sans = "JetBrainsMono Nerd Font"
font-mono = "JetBrainsMono Nerd Font"
tearing-mode = true

[bar]
padding = 0.5
bg = "bg-base"
border-width = 2
button-variant = "basic"
button-icon-size = 0.8999999761581421
button-rounding = "md"
button-group-background = "bg-base"
dropdown-shadow = false

[styling]
scale = 1.0

[styling.palette]
bg = "#1a1b1f"
surface = "#2a2b2f"
elevated = "#1a1b1f"
fg = "#dadbdd"
fg-muted = "#7f8083"
primary = "#c75465"
red = "#d04a3b"
yellow = "#d9a72c"
green = "#65ad5f"
blue = "#4993c6"

[modules.battery]
border-color = "accent"
icon-color = "fg-default"
icon-bg-color = "bg-base"
label-color = "fg-default"
button-bg-color = "bg-base"

[modules.bluetooth]
border-color = "accent"
icon-color = "fg-default"
icon-bg-color = "bg-base"
label-color = "fg-default"
button-bg-color = "bg-base"

[modules.brightness]
icon-color = "fg-default"
icon-bg-color = "bg-base"
label-color = "fg-default"
button-bg-color = "bg-base"
right-click = "sh -c 'pkill hyprsunset || hyprsunset -t 5000'"
scroll-up = "brightnessctl set 5%+"
scroll-down = "brightnessctl set 5%-"

[modules.cava]
bars = 15
noise-reduction = 0.5
direction = "mirror"
color = "fg-default"
button-bg-color = "bg-base"
bar-gap = 2

[modules.clock]
format = "%a - %d-%b - %H:%M"
icon-show = false
icon-color = "fg-default"
icon-bg-color = "fg-default"
label-color = "fg-default"
button-bg-color = "bg-base"
dropdown-show-seconds = true

[modules.cpu]
format = "{{ percent }}% | {{ temp_c }}°C"
icon-color = "fg-default"
label-color = "fg-default"
button-bg-color = "bg-base"

[modules.dashboard]
border-color = "accent"
icon-color = "fg-default"
icon-bg-color = "bg-base"

[modules.hyprsunset]
icon-color = "fg-default"
icon-bg-color = "bg-base"
label-color = "fg-default"
button-bg-color = "bg-base"

[modules.media]
border-color = "accent"
icon-color = "fg-default"
icon-bg-color = "bg-base"
label-color = "fg-default"
button-bg-color = "bg-base"
middle-click = """hyprctl dispatch 'hl.dsp.focus({window = "class:Spotify"})'"""

[modules.microphone]
icon-color = "fg-default"
icon-bg-color = "bg-base"
label-color = "fg-default"
button-bg-color = "bg-base"
scroll-up = "wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 0.05+"
scroll-down = "wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 0.05-"

[modules.network]
icon-color = "fg-default"
icon-bg-color = "bg-base"
label-color = "fg-default"
button-bg-color = "bg-base"

[modules.notifications]
border-color = "accent"
icon-color = "fg-default"
icon-bg-color = "bg-base"
label-show = false
label-color = "fg-default"
button-bg-color = "bg-base"
popup-position = "top-center"
popup-stacking-order = "oldest-first"
popup-duration = 3000
popup-monitor = "HDMI-A-1"
popup-close-behavior = "remove"

[modules.power]
border-color = "accent"
icon-color = "fg-default"
icon-bg-color = "bg-base"
right-click = 'hyprshutdown -p "systemctl reboot"'
middle-click = "loginctl terminate-session $XDG_SESSION_ID"
left-click = 'hyprshutdown -p "systemctl poweroff"'

[modules.ram]
format = "{{ used_gib }} GiB"
border-color = "accent"
icon-color = "fg-default"
label-color = "fg-default"
button-bg-color = "bg-base"

[modules.storage]
format = "{{ free_gib }} GiB free"
icon-color = "fg-default"
label-color = "fg-default"
button-bg-color = "bg-base"

[modules.systray]
item-gap = 0.75
button-bg-color = "bg-base"

[modules.volume]
border-color = "accent"
icon-color = "fg-default"
icon-bg-color = "bg-base"
label-color = "fg-default"
button-bg-color = "bg-base"
right-click = "~/.config/hypr/scripts/audio-toggle"
scroll-up = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+"
scroll-down = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05-"

[modules.weather]
provider = "weather-api"
location = "Bhopal"
weatherapi-key = "56cf8d7c8aaf4d34af3114504251007"
icon-color = "fg-default"
icon-bg-color = "bg-base"
label-color = "fg-default"
button-bg-color = "bg-base"

[osd]
duration = 2000
monitor = "HDMI-A-1"
margin = 75.0

[wallpaper]
transition-type = "none"
transition-duration = 0.5
cycling-enabled = true
cycling-directory = "/home/sharkthak/.config/wallpapers/"
cycling-interval-mins = 10
cycling-same-image = true

[[wallpaper.monitors]]
name = "eDP-1"
fit-mode = "stretch"
wallpaper = ""

[[wallpaper.monitors]]
name = "HDMI-A-1"
fit-mode = "stretch"
wallpaper = ""
