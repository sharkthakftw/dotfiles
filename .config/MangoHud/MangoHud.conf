legacy_layout=false

# general settings
no_display
round_corners=0
background_alpha=0
background_color=1A1B1F
font_size=20
text_color=DADBDD
position=top-left
toggle_hud=Shift_L+F2
pci_dev=0:01:00.0
table_columns=3

# cpu
cpu_text=CPU
cpu_stats
cpu_load_change
cpu_load_value=50,90
cpu_load_color=D9A72C,D37838,D04A3B
cpu_temp
cpu_color=4993C6

# gpu
gpu_text=GPU
gpu_stats
gpu_load_change
gpu_load_value=50,90
gpu_load_color=D9A72C,D37838,D04A3B
gpu_temp
gpu_color=65AD5F

# vram
vram
vram_color=DADBDD

# ram
ram
ram_color=DADBDD

# fps
fps
fps_metrics=avg
fps_limit_method=late
toggle_fps_limit=Shift_L+F1
fps_limit=0

# log
output_folder=/home/sharkthak
log_duration=30
autostart_log=0
log_interval=100
toggle_logging=Shift_L+F1

# blacklist
blacklist=pamac-manager,lact,ghb,bitwig-studio,ptyxis,yumex
