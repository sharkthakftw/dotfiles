# MEDIA PLAYER (Bottom Ly TUI box)
label {
    monitor =
    text = cmd[update:1000] /home/sharkthak/.config/hypr/scripts/hyprlock/media
    color = rgb(180, 190, 254)
    font_size = 16
    font_family = Terminess Nerd Font Mono
    position = 0, 40
    halign = center
    valign = bottom
}
