# GENERAL
general {
    hide_cursor = true
    immediate_render = true
    text_trim = false
    no_fade_in = true
    no_fade_out = true
}

# BACKGROUND
background {
    monitor =
    path = /home/sharkthak/.config/wallpapers/pixel-deer.png
    color = rgb(0, 0, 0)
    blur_passes = 1
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.8916
    vibrancy_darkness = 0.0
}

# BIG CLOCK
label {
    monitor =
    text = cmd[update:1000] /home/sharkthak/.config/hypr/scripts/hyprlock/bigclock
    color = rgb(180, 190, 254)
    font_size = 16
    font_family = Terminess Nerd Font Mono
    position = 0, 280
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] date +"%A, %B %d"
    color = rgb(166, 173, 200)
    font_size = 18
    font_family = Terminess Nerd Font Mono
    position = 0, 190
    halign = center
    valign = center
}

# MAIN LY TUI BOX
label {
    monitor =
    text = cmd[update:10000000] /home/sharkthak/.config/hypr/scripts/hyprlock/ly-box
    color = rgb(205, 214, 244)
    font_size = 16
    font_family = Terminess Nerd Font Mono
    position = 0, -30
    halign = center
    valign = center
}

# INLINE PASSWORD INPUT
input-field {
    monitor =
    size = 310, 24
    outline_thickness = 0
    dots_size = 0.8
    dots_spacing = 0.3
    dots_center = false
    dots_text_format = *
    dots_rounding = 0
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0)
    font_color = rgb(205, 214, 244)
    font_family = Terminess Nerd Font Mono
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    rounding = 0
    check_color = rgba(0, 0, 0, 0)
    fail_color = rgba(0, 0, 0, 0)
    fail_text =
    position = 30, -32
    halign = center
    valign = center
}

# AUTHENTICATION FAILURE MESSAGE
label {
    monitor =
    text = $FAIL
    color = rgb(243, 139, 168)
    # color = rgb(208, 74, 59)
    font_size = 16
    font_family = Terminess Nerd Font Mono
    position = 0, -100
    halign = center
    valign = center
}

