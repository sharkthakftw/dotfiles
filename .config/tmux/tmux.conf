unbind C-b
set -g prefix `
bind ` send-prefix

set -g base-index 1
set -g pane-base-index 1

set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

set -g status-style bg=default,fg=#dadbdd,bright
set -g status-left ""
set -g status-right "#[fg=#dadbdd,bright]#S"

set -g renumber-windows on

set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "

set -g window-status-current-style fg=#65ad5f
set -g window-status-bell-style fg=#d04a3b

set -g pane-border-lines simple
set -g pane-border-style fg=#dadbdd
set -g pane-active-border-style fg=#65ad5f

set -g escape-time 0
set -g mouse on
set -g repeat-time 1000

bind | split-window -h
bind - split-window -v
bind f resize-pane -Z

bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
