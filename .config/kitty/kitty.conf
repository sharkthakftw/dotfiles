font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        12

line_spacing     2
letter_spacing   0.5

enable_ligatures always

window_padding_width 0
draw_minimal_borders yes

tab_bar_style powerline
tab_powerline_style slanted

allow_remote_control yes
listen_on unix:/tmp/mykitty

background            #1A1B1F
foreground            #DADBDD
selection_background  #3B3C3F
selection_foreground  #DADBDD

cursor                #DADBDD
cursor_text_color     #1A1B1F

underline_color       #4993C6
visual_bell_color     #C75465

active_tab_background   #2A2B2F
active_tab_foreground   #DADBDD
inactive_tab_background #202124
inactive_tab_foreground #7F8083
tab_bar_background      #1A1B1F

color0  #1A1B1F
color1  #D04A3B
color2  #65AD5F
color3  #D9A72C
color4  #4993C6
color5  #8F63CC
color6  #5BCBB2
color7  #DADBDD
color8  #3B3C3F
color9  #C75465
color10 #65AD5F
color11 #D37838
color12 #4993C6
color13 #8F63CC
color14 #5BCBB2
color15 #CBCCCE

wheel_scroll_multiplier 5.0
